[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimtv-plex"
dynamic = ["version"]
description = "AI MTV — local reactive AI music television with a Plex music source"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Decentricity" }]
maintainers = [{ name = "smilidon" }]
keywords = ["ai-music", "music-video", "airadio", "plex", "local-ai", "generative-video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "airadio>=0.4.3",
  "faster-whisper>=1.2,<2",
  "numpy>=1.24",
  "soundfile>=0.12",
  "tqdm>=4.66",
  "huggingface_hub>=0.23",
  "torch>=2.1",
  "diffusers>=0.27",
  "transformers>=4.38",
  "accelerate>=0.27",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
plex = ["plexapi>=4.0", "lyricsgenius>=3.0", "mutagen>=1.45"]
dev = ["build", "twine", "pytest", "pyflakes"]

[project.scripts]
aimtv = "aimtv.cli:main"

[project.urls]
Homepage = "https://github.com/smilidon/aimtv-plex"
Repository = "https://github.com/smilidon/aimtv-plex"
Issues = "https://github.com/smilidon/aimtv-plex/issues"
Releases = "https://github.com/smilidon/aimtv-plex/releases"
Upstream = "https://github.com/Decentricity/aimtv"

[tool.setuptools.dynamic]
version = {attr = "aimtv.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimtv = ["data/*.json"]
