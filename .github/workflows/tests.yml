name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install audio integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      # The GPU/diffusion stack is not needed by the unit tests. Install the
      # package without deps and add only the lightweight test/build imports.
      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest pyflakes build twine numpy Pillow soundfile tqdm huggingface_hub \
            opencv-python-headless airadio plexapi mutagen lyricsgenius
      - name: Static checks
        run: python -m pyflakes src/aimtv tests
      - name: Unit and FFmpeg regression tests
        run: python -m pytest -q -ra
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
