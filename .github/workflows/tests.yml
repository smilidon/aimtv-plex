name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install audio integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      # The GPU/diffusion stack is deliberately omitted from this test
      # environment. Install lightweight imports before the no-deps package
      # install so pip does not report the intentional omissions as conflicts.
      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes build twine numpy Pillow soundfile tqdm huggingface_hub \
            opencv-python-headless airadio plexapi mutagen lyricsgenius
          python -m pip install --no-deps -e .
      - name: Static checks
        run: python -m pyflakes src/aimtv tests
      - name: Unit and FFmpeg regression tests
        run: python -m pytest -q -ra
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
