name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The GPU/diffusion stack (torch, diffusers, transformers, faster-whisper)
      # is not needed by the unit tests, so install the package without deps
      # and add only what the tests import.
      - run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pyflakes numpy Pillow soundfile tqdm huggingface_hub \
            opencv-python-headless airadio plexapi mutagen lyricsgenius
      - run: python -m pyflakes src/aimtv tests
      - run: python -m pytest -q
