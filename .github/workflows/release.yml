name: Release

on:
  push:
    branches: [master]
    paths: [src/aimtv/__init__.py]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version at the selected master commit
        required: true
        type: string
      publish_pypi:
        description: Publish the GitHub release distributions to PyPI
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    if: github.repository == 'smilidon/aimtv-plex' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test and build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes build twine packaging numpy Pillow soundfile tqdm huggingface_hub opencv-python-headless airadio plexapi mutagen lyricsgenius
          python -m pip install --no-deps -e .
      - name: Validate release identity and notes
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from importlib.metadata import metadata
          from pathlib import Path
          from packaging.version import Version
          import aimtv

          info = metadata('aimtv-plex')
          version = info['Version']
          assert info['Name'] == 'aimtv-plex'
          assert version == aimtv.__version__
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?', version), version
          expected = os.environ.get('EXPECTED_VERSION')
          assert not expected or expected == version, (expected, version)
          assert Path(f'docs/releases/{version}.md').is_file(), 'Release notes missing'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'prerelease={str(Version(version).is_prerelease).lower()}\n')
          PY
      - name: Static checks and complete regression suite
        run: |
          python -m pyflakes src/aimtv tests
          python -m pytest -q -ra
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel outside the source checkout
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          wheel="$(realpath dist/*.whl)"
          export SMOKE_DIR="$(mktemp -d)"
          python -m venv "$SMOKE_DIR/venv"
          "$SMOKE_DIR/venv/bin/python" -m pip install --no-deps "$wheel"
          cd "$SMOKE_DIR"
          "$SMOKE_DIR/venv/bin/python" - <<'PY'
          import json
          import os
          from importlib import metadata, resources
          import aimtv
          assert aimtv.__version__ == os.environ['VERSION']
          assert metadata.version('aimtv-plex') == aimtv.__version__
          assert str(aimtv.__file__).startswith(os.environ['SMOKE_DIR'])
          data = json.loads(resources.files('aimtv').joinpath('data/prompts.json').read_text(encoding='utf-8'))
          assert data['prompts'] and data['subjects']
          print('Installed wheel identity and package resources: OK')
          PY
          "$SMOKE_DIR/venv/bin/aimtv" --version
          "$SMOKE_DIR/venv/bin/aimtv" --help
      - name: Stage the tested release files
        if: matrix.python-version == '3.12'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p release-artifacts/dist
          cp dist/*.whl dist/*.tar.gz release-artifacts/dist/
          cp "docs/releases/$VERSION.md" release-artifacts/notes.md
          (cd release-artifacts/dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.12'
        with:
          name: python-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release
          path: release-artifacts
      - name: Verify distribution checksums
        run: cd release-artifacts/dist && sha256sum -c SHA256SUMS
      - name: Publish tested files without replacing an existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-build.outputs.version }}
          PRERELEASE: ${{ needs.test-build.outputs.prerelease }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          version = os.environ['VERSION']
          tag = f'v{version}'
          assert repo == 'smilidon/aimtv-plex'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          }

          def api(path, method='GET', data=None):
              body = json.dumps(data).encode() if data is not None else None
              request = Request(f'https://api.github.com/repos/{repo}/{path}',
                                headers=headers, method=method, data=body)
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except HTTPError as error:
                  if error.code == 404 and method == 'GET':
                      return None
                  raise

          def check_tag(ref):
              obj = ref['object']
              while obj['type'] == 'tag':
                  obj = api(f"git/tags/{obj['sha']}")['object']
              if obj['type'] != 'commit' or obj['sha'] != sha:
                  raise SystemExit('Refusing to move or reuse a tag at a different commit')

          def find_release():
              # The by-tag endpoint omits unpublished drafts. Enumerate the
              # authenticated collection and retain the returned numeric ID.
              page = 1
              while True:
                  releases = api(f'releases?per_page=100&page={page}')
                  matches = [item for item in releases if item['tag_name'] == tag]
                  if len(matches) > 1:
                      raise SystemExit('Multiple drafts for this tag; manual review required')
                  if matches:
                      return matches[0]
                  if len(releases) < 100:
                      return None
                  page += 1

          ref = api(f'git/ref/tags/{tag}')
          if ref:
              check_tag(ref)
          release = find_release()
          files = sorted(Path('release-artifacts/dist').iterdir())
          if release and not release['draft']:
              assert ref, 'Published release has no matching tag'
              required = {file.name for file in files}
              assert required <= {asset['name'] for asset in release['assets']}, 'Published release assets missing'
              print('Existing public release retained; PyPI will use its original assets.')
              raise SystemExit(0)
          fields = {
              'tag_name': tag,
              'target_commitish': sha,
              'name': f'AI MTV Plex {version}',
              'body': Path('release-artifacts/notes.md').read_text(encoding='utf-8'),
              'draft': True,
              'prerelease': os.environ['PRERELEASE'] == 'true',
          }
          if release is None:
              release = api('releases', 'POST', fields)
          else:
              # An untagged, unpublished draft can be completed by a repaired
              # workflow. Existing tags were checked above and are never moved.
              release = api(f"releases/{release['id']}", 'PATCH', fields)
          release_id = release['id']
          for path in files:
              for asset in release['assets']:
                  if asset['name'] == path.name:
                      api(f"releases/assets/{asset['id']}", 'DELETE')
              body = path.read_bytes()
              upload = Request(
                  f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={quote(path.name, safe="")}',
                  data=body, method='POST',
                  headers={**headers, 'Content-Type': 'application/octet-stream'},
              )
              with urlopen(upload, timeout=60) as response:
                  asset = json.load(response)
              assert asset['state'] == 'uploaded' and asset['size'] == len(body)
              if asset.get('digest'):
                  assert asset['digest'] == 'sha256:' + hashlib.sha256(body).hexdigest()
          published = api(f'releases/{release_id}', 'PATCH', {'draft': False})
          assert not published['draft']
          check_tag(api(f'git/ref/tags/{tag}'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"GitHub release published: {published['html_url']}\n")
          PY

  pypi:
    needs: [test-build, github-release]
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aimtv-plex/
    permissions:
      contents: read
      id-token: write
    steps:
      # No source checkout or package build in the credential-bearing job.
      - name: Download the original published release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-build.outputs.version }}
        run: |
          mkdir dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS && mv SHA256SUMS ../SHA256SUMS)
      - name: Publish to PyPI using the registered Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Verify PyPI published the same files
        env:
          VERSION: ${{ needs.test-build.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          version = os.environ['VERSION']
          url = f'https://pypi.org/pypi/aimtv-plex/{version}/json'
          for attempt in range(5):
              try:
                  with urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  break
              except HTTPError as error:
                  if error.code != 404 or attempt == 4:
                      raise
                  time.sleep(3)
          hashes = {item['filename']: item['digests']['sha256'] for item in data['urls']}
          # pypi-publish also writes *.publish.attestation files here; those
          # are not distribution entries in the PyPI JSON API.
          files = list(Path('dist').glob('*.whl')) + list(Path('dist').glob('*.tar.gz'))
          assert files, 'No distributions to verify'
          for path in files:
              assert hashes.get(path.name) == hashlib.sha256(path.read_bytes()).hexdigest(), path.name
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'PyPI publication verified: https://pypi.org/project/aimtv-plex/{version}/\n')
          PY
      - name: Explain the authorization prerequisite on failure
        if: failure()
        run: |
          echo 'PyPI publication did not complete. The GitHub release remains available.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For invalid-publisher/authentication errors, register the PyPI pending publisher: aimtv-plex / smilidon / aimtv-plex / release.yml / environment pypi. See docs/RELEASING.md, then re-run failed jobs.' >> "$GITHUB_STEP_SUMMARY"
